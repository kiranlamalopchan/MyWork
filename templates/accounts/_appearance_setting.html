<section class="card card__pad appearance-setting" aria-labelledby="appearance-title">
  <div><h3 class="appearance-setting__title" id="appearance-title">Dark mode</h3><p class="help">Choose light or dark appearance on this device.</p></div>
    <button type="button" class="daynight" id="theme-toggle" role="switch" aria-checked="false"
            aria-label="Dark theme">
      <span class="daynight__track" aria-hidden="true">
        <span class="daynight__night"></span>
        <span class="daynight__stars"></span>
        <span class="daynight__knob">
          <svg class="daynight__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/>
          </svg>
          <svg class="daynight__moon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M20.2 14.4A8.5 8.5 0 0 1 9.6 3.8a8.5 8.5 0 1 0 10.6 10.6Z"/>
          </svg>
        </span>
      </span>
    </button>
</section>
