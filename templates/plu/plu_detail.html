{% extends "base.html" %}
{% block title %}PLU {{ item.plu_no }} · MyWork{% endblock %}

{% block content %}

<div class="detail-hero">
  <div class="detail-hero__label">PLU code</div>
  <div class="detail-hero__plu">{{ item.plu_no }}</div>
  <div class="detail-hero__desc">{{ item.description }}</div>
</div>

<div class="detail-actions">
  {# The number is what actually gets keyed into the scale, so make it one tap. #}
  <button type="button" class="btn btn--primary btn--block" data-copy="{{ item.plu_no }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="12" height="12" rx="2.5"/>
      <path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/>
    </svg>
    Copy PLU number
  </button>

  <a class="btn btn--block" href="{% url 'plu:list' %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m15 18-6-6 6-6"/>
    </svg>
    Back to search
  </a>
</div>

{% endblock %}
