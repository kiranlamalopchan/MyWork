{% comment %}A labelled field, optional help, and a stable validation slot.{% endcomment %}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if show_help and field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  <div class="help help--error" data-error{% if not field.errors %} hidden{% endif %}>{{ field.errors|striptags }}</div>
</div>
