<div class="field">
  <label class="label" for="{{ field.id_for_label }}">{{ label }}</label>
  <input class="input" type="{{ kind }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
         {% if kind == 'text' %}value="{{ field.value|default:'' }}" autocapitalize="none" autocorrect="off"{% endif %}
         autocomplete="{{ autocomplete }}" enterkeyhint="{{ enterkeyhint }}" required>
  {% if show_errors and field.errors %}<div class="help help--error">{{ field.errors|striptags }}</div>
  {% elif password_help %}<div class="help">At least 8 characters, and not all numbers.</div>{% endif %}
</div>
